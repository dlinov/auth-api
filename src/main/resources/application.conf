include "application.secret.conf"

fp {
  app {
    host = "http://localhost:9000/api"
    host = ${?APP_HOST}
  }

  db {
    url = "jdbc:mysql://localhost:3306/myapp_db?autoReconnect=true&characterEncoding=utf-8&connectionCollation=utf8_unicode_ci&useSSL=false&useAffectedRows=true"
    url = ${?DATABASE_URL}
    user = "myapp_user"
    user = ${?DATABASE_USER}
    password = "password"
    password = ${?DATABASE_PASSWORD}
    min-idle = 1
    min-idle = ${?DATABASE_MIN_IDLE_CONN}
    pool-size = 20
    pool-size = ${?DATABASE_MAX_POOL_SIZE}
  }

  logging {
    is-enabled = true
    is-enabled = ${?HTTP_LOGGING_ENABLED}
    log-headers = true
    log-headers = ${?HTTP_LOG_HEADERS}
    log-body = true
    log-body = ${?HTTP_LOG_BODY}
  }

  auth {
    token-expiration-offset-minutes = 10
    token-expiration-offset-minutes = ${?AUTH_TOKEN_EXPIRATION_MINUTES}
    account-lock-timeout = 30 minutes
    account-lock-timeout = ${?ACCOUNT_LOCK_TIMEOUT}
    require-captcha = false
    require-captcha = ${?REQUIRE_CAPTCHA}
    max-bad-login-attempts = 3
    max-bad-login-attempts = ${?MAX_BAD_LOGIN_ATTEMPTS}
    recaptcha-url = "https://www.google.com/recaptcha/api/siteverify"
    recaptcha-url = ${?RECAPTCHA_URL}
  }

  email {
    host = "smtp-relay.gmail.com"
    port = 25
    sender-address = "noreply@foo.bar"
    sender-name = "BackOffice"
    retry-timeout = 1 minute
    max-retries = 15
  }

  proxy {
    host = "172.30.1.41"
    host = ${?PROXY_HOST}
    port = 8601
    port = ${?PROXY_PORT}
  }

  server {
    # Time a keep-alive connection may sit idle before the server closes it.
    idle-timeout = 60 seconds
    idle-timeout = ${?SERVER_IDLE_TIMEOUT}
    # Time allowed to receive the request line + headers before aborting the connection.
    header-timeout = 30 seconds
    header-timeout = ${?SERVER_HEADER_TIMEOUT}
    # Overall wall-clock budget for producing a response to a single request.
    request-timeout = 45 seconds
    request-timeout = ${?SERVER_REQUEST_TIMEOUT}
    # Maximum accepted request body size, in bytes, enforced before it is buffered/parsed.
    max-request-body-bytes = 10485760
    max-request-body-bytes = ${?SERVER_MAX_REQUEST_BODY_BYTES}
  }
}
