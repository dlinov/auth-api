name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Generate test signing keys
        run: |
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
            -out src/test/resources/auth.key
          openssl pkey -in src/test/resources/auth.key -pubout \
            -out src/test/resources/auth.key.pub

      - name: Test with coverage
        run: sbt "clean ; coverage ; testOnly * ; coverageReport"

      - name: Validate dependencies and package
        run: sbt "evicted ; Universal/stage"
